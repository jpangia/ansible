---
- name: usage
  ansible.builtin.debug:
  msg: | 
       "please define the following variables:
       borg_repo
       dir_to_backup
       target_name"
  when: borg_repo is undefined and 
        dir_to_backup is undefined and
        target_name is undefined 

- name: install borg
  ansible.builtin.package:
    name: borgbackup
    state: latest

- name: ensure /root/borg
  ansible.builtin.file:
    path: /root/borg
    owner: root
    group: root
    mode: "0700"
    state: directory

# purposefully fails if variables not specified
- name: template files to /root/borg/
  ansible.builtin.template:
    path: "/root/borg/{{ item }}"
    state: present
    source: "{{ item }}.j2"
  with_items:
    - "borg_client.sh.j2"
    - ".borg_env"
    - "give_pass.sh"
 
